name: Check and publish Mallside

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build generated browser files
        run: npm run build
      - name: Verify public output excludes the source tree
        run: npm run check:public
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: public-game
          path: build/site
          include-hidden-files: true
          retention-days: 1

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mallside-public-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: public-game
          path: .public-game
      - name: Check out generated-files hosting repo
        uses: actions/checkout@v6
        with:
          repository: YouKnowJP/YouKnowJP.github.io
          ref: main
          ssh-key: ${{ secrets.MALLSIDE_PAGES_DEPLOY_KEY }}
          path: .public-host
      - name: Prepare only verified public output
        run: node scripts/publish-static.mjs .public-game .public-host
      - name: Publish generated game files
        working-directory: .public-host
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Mallside
          if git diff --cached --quiet; then
            echo 'Generated game is already current.'
          else
            git commit -m "Publish Mallside ${SOURCE_COMMIT}"
            git push origin HEAD:main
          fi
